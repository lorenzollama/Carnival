name: Carnival weekly ad

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the hour
  workflow_dispatch:
    inputs:
      source_url:
        description: "Link to this week's ad: the texted sf0.co link, the PDF, or an image. Leave empty for the store's PDF."
        required: false
        type: string
      force:
        description: "Process it even if this exact file was processed before"
        type: boolean
        default: false

concurrency:
  group: carnival
  cancel-in-progress: false

permissions:
  contents: write # the repo is the state: each run commits what it did

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"

      # The cheap part, every hour: a conditional GET, a hash, and any notice that's due.
      # Inputs reach Python as environment variables, never as part of a shell command.
      - name: Look for a new ad
        id: check
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          FORCE: ${{ inputs.force }}
        run: python -m carnival check

      # The heavy part, only when there's a new file (or one to finish).
      - name: Install poppler, Pillow, and Claude Code
        if: steps.check.outputs.process == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install --quiet pillow==13.0.0
          npm install --global --silent @anthropic-ai/claude-code@2.1.308
          pdfimages -v 2>&1 | head -1
          claude --version

      - name: Read the ad and send the deals
        if: steps.check.outputs.process == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: "1" # stay on the pinned version
        run: python -m carnival process
